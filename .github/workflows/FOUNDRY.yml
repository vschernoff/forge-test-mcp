name: Foundry compatibility

# FR-36: the whole suite, including the real-forge integration tests, against every forge
# version in the supported range (package.json `foundryCompatibility`).

# D25 (CI minutes): pull requests run Linux only; the full OS matrix runs on main, nightly and
# on demand.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  forge:
    name: forge ${{ matrix.forge }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        forge: [v1.8.5, v1.8.6]
    env:
      FORGE_TEST_MCP_REQUIRE_FORGE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install forge ${{ matrix.forge }}
        # foundry-rs/foundry-toolchain v1.9.1, pinned by commit.
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: ${{ matrix.forge }}
          cache: false
      - name: Locate forge
        shell: bash
        run: |
          forge --version
          if [ "$RUNNER_OS" = "Windows" ]; then echo "FORGE_BIN=forge" >> "$GITHUB_ENV"
          else echo "FORGE_BIN=$(command -v forge)" >> "$GITHUB_ENV"; fi
      - run: npm ci
      # Fetches the pinned forge-std and lets forge install solc once, online. The server
      # itself always runs forge with --offline.
      - run: node test/helpers/prepare-forge.js
      - run: npm test
      # The installed package, not the working tree, against the same forge.
      - run: npm run test:packed
